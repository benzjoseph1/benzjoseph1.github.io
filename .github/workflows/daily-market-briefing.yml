name: Daily Market Briefing

on:
  # 4pm PST (UTC-8) = 00:00 UTC the next calendar day
  # 4pm PDT (UTC-7) = 23:00 UTC the same calendar day
  # Running at both times covers daylight-saving transitions year-round.
  schedule:
    - cron: "0 0 * * 2-6"   # 4pm PST (winter: UTC-8) — fires Tue–Sat UTC = Mon–Fri PST
    - cron: "0 23 * * 1-5"  # 4pm PDT (summer: UTC-7) — fires Mon–Fri

  # Allow manual trigger from the GitHub Actions tab for ad-hoc runs
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run market briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/market_briefing.py

      - name: Commit updated predictions cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_predictions.json || true
          git diff --staged --quiet || git commit -m "chore: update predictions cache [skip ci]"
          git push origin HEAD || true
