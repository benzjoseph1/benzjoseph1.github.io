name: Daily Market Briefing

on:
  # 4pm PST = 23:00 UTC (during PDT/summer, UTC-7)
  # Runs Mon-Fri at market close
  schedule:
    - cron: "0 23 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run market briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/market_briefing.py

      - name: Commit updated predictions cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_predictions.json || true
          git diff --staged --quiet || git commit -m "chore: update predictions cache [skip ci]"
          git push origin HEAD || true
