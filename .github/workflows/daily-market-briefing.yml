name: Daily Market Briefing

on:
  # 4:10pm PDT (UTC-7) = 23:10 UTC — gives the market a 10-min buffer after 4pm ET close
  # In winter (PST, UTC-8), this fires at 3:10pm PST, still well after 4pm ET market close
  schedule:
    - cron: "10 23 * * 1-5"

  # Allow manual trigger from the GitHub Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write  # required to commit last_predictions.json back to the repo

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "anthropic>=0.40.0"

      - name: Generate and send briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/market_briefing.py

      - name: Commit updated predictions cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_predictions.json || true
          git diff --staged --quiet || git commit -m "chore: update predictions cache [skip ci]"
          git push origin HEAD || true
