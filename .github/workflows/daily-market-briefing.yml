name: Daily Market Briefing

# Runs every weekday at 4:00 PM EST (market close = 20:00 UTC)
# To run at 4pm PST instead, change to: '0 23 * * 1-5'
# Manual trigger also available via Actions tab -> Run workflow
on:
  schedule:
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      custom_date:
        description: 'Override briefing date (YYYY-MM-DD). Leave blank for today.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requires the following GitHub Secrets to be configured:
      #   ANTHROPIC_API_KEY  — your Anthropic API key
      #   GMAIL_OAUTH_TOKEN  — Gmail OAuth refresh token (see setup guide below)
      #
      # Gmail MCP OAuth setup:
      #   1. Go to console.cloud.google.com -> APIs & Services -> Credentials
      #   2. Create OAuth 2.0 Client ID (Desktop app)
      #   3. Enable Gmail API
      #   4. Run the OAuth flow once locally to obtain a refresh token
      #   5. Add the refresh token as secret GMAIL_OAUTH_TOKEN in repo Settings -> Secrets
      - name: Run Daily Market Briefing
        uses: anthropics/claude-code-action@v1
        with:
          prompt_file: .github/prompts/daily-market-briefing.md
          # Tools needed: web search for news, Gmail for sending
          allowed_tools: 'WebSearch,WebFetch,mcp__Gmail__create_draft,mcp__Gmail__label_message'
          # MCP server config for Gmail (injected at runtime)
          claude_mcp_config: |
            {
              "mcpServers": {
                "Gmail": {
                  "command": "npx",
                  "args": ["-y", "@gptscript-ai/gmail-mcp-server"],
                  "env": {
                    "GMAIL_OAUTH_TOKEN": "${{ secrets.GMAIL_OAUTH_TOKEN }}"
                  }
                }
              }
            }
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
